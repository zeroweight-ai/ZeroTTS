name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src webui evaluation examples
      - name: Test
        # Tests marked `model` are skipped without ZEROTTS_TEST_MODEL — CI does
        # not download ~900MB of weights on every push.
        run: pytest tests/ -q
      - name: Import check
        run: python -c "import zerotts; print(zerotts.__version__)"

  typecheck-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: js/package.json
      - run: npm install
        working-directory: js
      - run: npm run typecheck
        working-directory: js
